# Material Category 标准目录 v1 (CR-039)
# 来源：MDM-REQ-CR-039 §4（权威内容，4 L1 + 19 L2 + 78 L3 共 101 项）
# 模型：三级标准树。L1 物料大类（parentCode 为空），L2 工程系统/专业域，L3 可归类叶子。
#       Part 仅引用无 ACTIVE 子节点的 L3 叶子；禁止第四层。
# 编码：code 采用层级语义 + 受控缩写（Scope/Domain 缩写由 MaterialCategoryAbbreviationRegistry 维护），
#       新 code 总长度不超过 32 字符。完整语义由 name/nameLocal/description 承载。
#       aliases 仅用于检索与 legacy 映射同义词，不落库、不生成第二条类别。
# 校验：目录由 MaterialCategoryCatalogLoader 静态校验（固定 101 项、4/19/78 分层、code/双语名称唯一、
#       父子前缀、无 _X_/四层/环路/孤儿/跨 scope 挂接、声明 level 与父链深度一致）后经
#       MaterialCategoryCatalogBootstrap 按 L1→L2→L3 拓扑幂等导入
#       （受开关 iov.mdm.material-category-catalog.bootstrap-enabled 控制）。
version: 1
