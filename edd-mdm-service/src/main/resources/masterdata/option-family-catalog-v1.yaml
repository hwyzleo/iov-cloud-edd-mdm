# Option Family 标准目录 v1 (CR-035)
# 来源：MDM-REQ-CR-035 §4（权威内容，Core 22 + Conditional 34）
# 层级：CORE 核心标准族（受控初始化导入为 ACTIVE） / CONDITIONAL 条件标准族（按需启用，不默认初始化）
# Extension 企业扩展族不进入本目录，仅作为命名指导（必须使用 OF_<PREFIX>_X_* 命名空间）
# 说明：具体选项族 code 不固化为 Java enum；本目录由 OptionFamilyCatalogLoader 静态校验后经
#       OptionFamilyCatalogBootstrap 幂等导入（受开关 iov.mdm.option-family-catalog.bootstrap-enabled 控制）
version: 1
